fail_fast: false
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"
default_language_version:
  python: python3
  node: system
exclude: |
  (?x)^(
    .*/node_modules/.*|
    .*/vendor/.*|
    .*/dist/.*|
    .*/coverage/.*|
    back-end/runtime/.*|
    back-end/cache/.*|
    back-end/logs/.*|
    back-end/storage/.*|
    back-end/uploads/.*|
    scripts/dev/logs/.*|
    back-end/composer\.phar|
    admin_frontend/public/docs/.*\.pdf|
    .*\.min\.js$
  )$

repos:
  # --- format ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      # lint
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: (^|.*/)(package-lock\.json|composer\.lock)$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-symlinks
      # security
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        files: \.(js|vue|css|html|json|ya?ml|md)$
        exclude: |
          (?x)^(
            .*/package-lock\.json|
            .*/composer\.lock|
            .*/public/language-pack.*\.json$
          )$

  # --- lint ---
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: local
    hooks:
      - id: php-lint
        name: PHP syntax
        language: system
        types: [php]
        entry: bash -c 'status=0; for f in "$@"; do php -l "$f" || status=1; done; exit $status' --
      - id: eslint
        name: ESLint
        language: system
        files: ^(admin_frontend|client_frontend)/.*\.(js|vue)$
        types: [file]
        entry: bash -c 'for p in admin_frontend client_frontend; do if [ -x "$p/node_modules/.bin/eslint" ]; then "$p/node_modules/.bin/eslint" --resolve-plugins-relative-to "$p" --ext .vue,.js --ignore-pattern node_modules --ignore-pattern dist --fix "$@"; exit $?; fi; done; echo "eslint is not installed in admin_frontend or client_frontend"; exit 1' --

  # --- security ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- bandit hunter ---
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-ll, -q]
        exclude: (^|.*/)(tests|__tests__)/

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.174.0
    hooks:
      - id: semgrep
        args:
          - --disable-version-check
          - --quiet
          - --skip-unknown-extensions
          - --error
          - --severity=ERROR
          - --config=p/security-audit
          - --config=p/owasp-top-ten
          - --config=p/php
          - --config=p/javascript
          - --config=p/bandit
