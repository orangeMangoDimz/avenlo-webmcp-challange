name: One-time database sync to VPS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Encrypted database archive release tag
        required: true
        type: string
      expected_sha256:
        description: SHA-256 of the encrypted archive
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate encrypted database archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          mkdir transfer
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern current-db.sql.gz.enc --dir transfer
          actual_sha256="$(sha256sum transfer/current-db.sql.gz.enc | cut -d ' ' -f1)"
          test "$actual_sha256" = "$EXPECTED_SHA256"

      - name: Decrypt and validate database archive
        env:
          DB_TRANSFER_KEY: ${{ secrets.DB_TRANSFER_20260903 }}
        run: |
          set -euo pipefail
          test -n "$DB_TRANSFER_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -pass env:DB_TRANSFER_KEY \
            -in transfer/current-db.sql.gz.enc \
            | gzip -d > transfer/development.sql
          test -s transfer/development.sql
          tail -n 5 transfer/development.sql | grep -q 'Dump completed'

      - name: Configure SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'printf "SSH connection verified\\n"'

      - name: Back up and replace VPS database
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID}"
          remote_dump="/tmp/avenlo-db-import-${run_id}.sql"
          scp transfer/development.sql "$VPS_USER@$VPS_HOST:$remote_dump"
          cat > /tmp/avenlo-restore.sh <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          run_id="$1"
          stack_dir=/opt/avenlo-crm
          dump_file="/tmp/avenlo-db-import-${run_id}.sql"
          backup_file="/var/backups/avenlo-crm/pre-dev-sync-${run_id}.sql"

          cd "$stack_dir"
          test -f .env
          test -f infra/docker/vps-http/docker-compose.yml
          test -s "$dump_file"
          tail -n 5 "$dump_file" | grep -q 'Dump completed'

          compose() {
            docker compose --env-file .env -f infra/docker/vps-http/docker-compose.yml "$@"
          }

          restore_dump() {
            local file="$1"
            compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -e "DROP DATABASE IF EXISTS \`$MYSQL_DATABASE\`; CREATE DATABASE \`$MYSQL_DATABASE\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; SET GLOBAL log_bin_trust_function_creators = 1;"'
            sed -E 's/DEFINER=`[^`]+`@`[^`]+`//g' "$file" \
              | compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"'
          }

          sudo install -d -m 700 /var/backups/avenlo-crm
          compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqldump -uroot --single-transaction --routines --events --triggers "$MYSQL_DATABASE"' \
            | sudo tee "$backup_file" >/dev/null
          sudo test -s "$backup_file"
          sudo tail -n 5 "$backup_file" | grep -q 'Dump completed'
          sudo chmod 600 "$backup_file"

          compose stop api
          if ! restore_dump "$dump_file"; then
            restore_dump "$backup_file"
            compose up -d api
            exit 1
          fi
          rm -f "$dump_file"
          compose up -d api
          compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -N "$MYSQL_DATABASE" -e "SELECT CONCAT(\"tables=\", COUNT(*)) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_type = \"BASE TABLE\"; SELECT CONCAT(\"views=\", COUNT(*)) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_type = \"VIEW\"; SELECT CONCAT(\"routines=\", COUNT(*)) FROM information_schema.routines WHERE routine_schema = DATABASE(); SELECT CONCAT(\"triggers=\", COUNT(*)) FROM information_schema.triggers WHERE trigger_schema = DATABASE(); SELECT CONCAT(\"events=\", COUNT(*)) FROM information_schema.events WHERE event_schema = DATABASE();"'
          REMOTE_SCRIPT
          scp /tmp/avenlo-restore.sh "$VPS_USER@$VPS_HOST:/tmp/avenlo-restore-${run_id}.sh"
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "bash /tmp/avenlo-restore-${run_id}.sh '$run_id'; rm -f /tmp/avenlo-restore-${run_id}.sh"

      - name: Verify public HTTP endpoint
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 10 "http://$VPS_HOST/" >/dev/null; then
              exit 0
            fi
            sleep 6
          done
          exit 1
