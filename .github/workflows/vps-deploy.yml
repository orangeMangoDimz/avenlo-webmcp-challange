name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: avenlo-vps-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'printf "SSH connection verified\\n"'

      - name: Upload source and deploy
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'bootstrap/' \
            --exclude '.git/' \
            ./ "$VPS_USER@$VPS_HOST:/opt/avenlo-crm/"
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /opt/avenlo-crm
            test -f .env
            docker compose --env-file .env -f infra/docker/vps-http/docker-compose.yml up -d --build
            docker compose --env-file .env -f infra/docker/vps-http/docker-compose.yml ps
          '

      - name: Verify public HTTP endpoint
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 10 "http://$VPS_HOST/" >/dev/null; then
              exit 0
            fi
            sleep 6
          done
          exit 1
